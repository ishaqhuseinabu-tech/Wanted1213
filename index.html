<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Wanted.com — Creative Acrylic</title>
  <meta name="description" content="Wanted.com melayani jasa cutting dan pembuatan kreatifitas dari akrilik.">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif;
      color:#fff; background:#050505;
      display:flex; justify-content:center; padding:28px 14px;
      overflow-x:hidden;
    }
    body:before{
      content:""; position:fixed; inset:-20%; z-index:-2;
      background:
        radial-gradient(circle at 50% 10%, rgba(255,92,0,.20), transparent 32%),
        radial-gradient(circle at 10% 80%, rgba(255,92,0,.10), transparent 28%),
        #050505;
    }
    .wrap{width:100%;max-width:520px}
    .card{
      position:relative; overflow:hidden; border:1px solid rgba(255,106,0,.42);
      border-radius:30px; padding:28px 18px 22px;
      background:rgba(10,10,10,.88);
      box-shadow:0 20px 70px rgba(0,0,0,.55), 0 0 40px rgba(255,75,0,.08);
      backdrop-filter:blur(8px);
    }
    .topline{height:4px;width:90px;margin:0 auto 22px;border-radius:99px;background:#ff5a00;box-shadow:0 0 18px rgba(255,90,0,.75)}
    .logo{
      width:142px;height:142px;object-fit:cover;display:block;margin:0 auto 16px;
      border-radius:50%; border:4px solid #ff5a00; box-shadow:0 0 30px rgba(255,90,0,.35);
      background:#000;
    }
    h1{margin:0;text-align:center;font-size:31px;letter-spacing:1px}
    .desc{margin:10px auto 25px;max-width:400px;text-align:center;color:#cfcfcf;line-height:1.55;font-size:14px}
    .links{display:grid;gap:12px}
    .link{
      display:flex;align-items:center;gap:15px;min-height:62px;padding:11px 16px;
      text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.10);
      border-radius:17px;background:linear-gradient(100deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
      transition:.18s ease; position:relative;
    }
    .link:hover{transform:translateY(-2px);border-color:#ff5a00;box-shadow:0 8px 25px rgba(255,90,0,.15)}
    .icon{
      width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
      background:#111;border:1px solid rgba(255,255,255,.14);flex:0 0 40px;
    }
    .icon svg{width:22px;height:22px;fill:currentColor}
    .name{font-weight:700;font-size:15px}.sub{font-size:12px;color:#9f9f9f;margin-top:3px}
    .arrow{margin-left:auto;color:#ff6a00;font-size:22px}
    .footer{text-align:center;color:#777;font-size:11px;margin-top:21px}
    .badge{display:inline-block;margin-top:9px;padding:6px 10px;border:1px solid rgba(255,90,0,.25);border-radius:999px;color:#aaa}
    @media(max-width:380px){.card{padding:24px 13px}.logo{width:126px;height:126px}}
  </style>
</head>
